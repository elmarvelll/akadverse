name: marketplace CI

on:
  push:
    paths:
      - "services/marketplace/**"
  pull_request:
    paths:
      - "services/marketplace/**"

jobs:
  security-scan:
    uses: ./.github/workflows/shared/snyk-scan-template.yml
    with:
      working-directory: services/marketplace
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
