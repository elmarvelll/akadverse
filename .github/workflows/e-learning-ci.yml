name: e-learning CI

on:
  push:
    paths:
      - "services/e-learning/**"
  pull_request:
    paths:
      - "services/e-learning/**"

jobs:
  security-scan:
    uses: ./.github/workflows/shared/snyk-scan-template.yml
    with:
      working-directory: services/e-learning
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
